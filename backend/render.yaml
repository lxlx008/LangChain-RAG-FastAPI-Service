services:
  - type: web
    name: rag-backend
    env: python
    plan: starter
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: LLM_TYPE
        value: "ALIYUN"
      - key: EMBED_MODEL_TYPE
        value: "ALIYUN"
      - key: VISION_MODEL_TYPE
        value: "ALIYUN"
      - key: ALIYUN_ACCESS_KEY_SECRET
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_DB
        value: "0"
      - key: JWT_SECRET_KEY
        sync: false
      - key: RATE_LIMIT_ENABLED
        value: "false"
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: CHROMA_PERSIST_DIRECTORY
        value: "./data/chroma"
      - key: UPLOAD_DIR
        value: "./data/uploads"
      - key: RERANKER_MODEL_PATH
        value: "./models/Qwen3-Reranker-0.6B"
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: rag-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
